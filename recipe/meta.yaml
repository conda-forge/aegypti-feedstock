{% set name = "aegypti" %}
{% set version = "0.5.4" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/aegypti-{{ version }}.tar.gz
  sha256: 70a7bece472730b18d0a06291d92fe94fcaadd25ffc69866f54098f08f8ba5c7

build:
  entry_points:
    - triangle = aegypti.app:main
    - test_triangle = aegypti.test:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - hvala >=0.1.2

test:
  imports:
    - aegypti
  commands:
    - pip check
    - triangle --help
    - test_triangle --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/frankvegadelgado/finlay
  summary: Solve the Triangle-Free Problem for an undirected graph encoded in DIMACS format.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - frankvegadelgado
